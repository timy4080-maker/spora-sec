name: SEC-01 checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Pinned compiler and protoc
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
          $arch = if ($IsWindows) { 'win64' } else { 'linux-x86_64' }
          $expected = if ($IsWindows) { 'f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3' } else { '121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278' }
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-$arch.zip" -OutFile protoc.zip
          if ((Get-FileHash protoc.zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'protoc checksum mismatch' }
          Expand-Archive protoc.zip protoc
          if (-not $IsWindows) { chmod +x protoc/bin/protoc }
          $exe = if ($IsWindows) { 'protoc.exe' } else { 'protoc' }
          "PROTOC=$PWD/protoc/bin/$exe" | Out-File -Append $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Negative, crash and delivery tests
        shell: pwsh
        run: |
          cargo test --locked 2>&1 | Tee-Object rust-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SPORA_MEASURE_OUTPUT = "$PWD/sizes.json"
          cargo test --locked --lib measurements_real_signal_and_pq_updates -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux host-encrypted service credential
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          head -c 32 /dev/urandom | sudo systemd-creds encrypt --name=spora-wrapping-key --with-key=host - "$work/key.enc"
          run_client() {
            sudo systemd-run --quiet --pipe --wait --collect -p "User=$(id -un)" -p "LoadCredentialEncrypted=spora-wrapping-key:$work/key.enc" "$PWD/target/debug/spora-sec" --profile "$work/profile" "$@"
          }
          run_client init > /dev/null
          run_client status | python3 -c 'import json,sys; assert not json.load(sys.stdin)["test_key"]'
          if env -u CREDENTIALS_DIRECTORY target/debug/spora-sec --profile "$work/profile" status; then exit 1; fi
          mkdir "$work/unmanaged"
          head -c 32 /dev/urandom > "$work/unmanaged/spora-wrapping-key"
          chmod 0440 "$work/unmanaged/spora-wrapping-key"
          if env CREDENTIALS_DIRECTORY="$work/unmanaged" target/debug/spora-sec --profile "$work/fresh" init; then exit 1; fi
          head -c 32 /dev/urandom | sudo systemd-creds encrypt --name=spora-wrapping-key --with-key=host - "$work/other.enc"
          if sudo systemd-run --quiet --pipe --wait --collect -p "User=$(id -un)" -p "LoadCredentialEncrypted=spora-wrapping-key:$work/other.enc" "$PWD/target/debug/spora-sec" --profile "$work/profile" status; then exit 1; fi
      - name: Two process TLS laboratory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install --git https://github.com/timy4080-maker/spora-relay.git --rev 97d5b5c02ebc719f86d9d192aa42e1a25c913797 --locked --root .local/relay-tools --bin spora-relay spora-relay
          python3 scripts/internet_lab.py --client-bin target/debug/spora-sec --relay-bin .local/relay-tools/bin/spora-relay --output tls-lab.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: evidence-${{ runner.os }}
          path: |
            rust-tests.txt
            sizes.json
            tls-lab.json
